server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NeuraNet's React app uses HashRouter, so no rewrite is strictly
    # required, but this keeps deep-links working if it's ever switched
    # to BrowserRouter.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
